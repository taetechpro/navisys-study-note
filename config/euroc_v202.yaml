# EuRoC V2_02_medium calibration.
# EuRoC sensor.yaml stores T_BS; this project expects T_cam_imu, so use inverse(T_BS).

dataset_type: "euroc"
dataset: "data/EuRoC_MAV_Dataset/vicon_room2/V2_02_medium/mav0"
output:  "results/euroc_v202"
max_frames: 0   # 0 = all frames

init:
  mode: "stationary_imu"
  static_window_sec: 1.0
  gravity_norm: 9.81

imu_noise:
  gyro:       1.6968e-4
  accel:      2.0000e-3
  gyro_walk:  1.9393e-5
  accel_walk: 3.0000e-3

ekf:
  sigma_vo: 0.05

