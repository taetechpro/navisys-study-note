# KITTI raw template.
# Replace the dataset path and both T_cam_imu matrices with sequence-specific calibration
# before running. The stereo intrinsics below are only an example placeholder.

dataset_type: "kitti_raw"
dataset: "/mnt/d/datasets/KITTI/2011_09_26_drive_0001_sync"
output:  "/mnt/d/02_research/05_cpp_LC-EKF_VIO/results/kitti_raw"
max_frames: 0

init:
  mode: "stationary_imu"
  static_window_sec: 1.0
  gravity_norm: 9.81

imu_noise:
  gyro:       1.6968e-4
  accel:      2.0000e-3
  gyro_walk:  1.9393e-5
  accel_walk: 3.0000e-3

ekf:
  sigma_vo: 0.10

depth_segmentation:
  min_depth_m: 0.5
  max_depth_m: 30.0
  image_stride: 4
  min_x: -10.0
  max_x: 50.0
  min_y: -25.0
  max_y: 25.0
  min_z: -3.0
  max_z: 3.0
  floor_search_min_z: -2.6
  floor_search_max_z: -0.2
  floor_distance_threshold_m: 0.10
  floor_normal_min_abs_dot_gravity: 0.90
  min_floor_inliers: 500
  wall_min_z: -1.6
  wall_max_z: 2.5
  wall_distance_threshold_m: 0.15
  wall_normal_max_abs_dot_gravity: 0.25
  min_wall_extent_m: 1.5
  min_wall_height_m: 0.8
  min_wall_inliers: 250
  ransac_iterations: 160
  sgbm_min_disparity: 0
  sgbm_num_disparities: 192
  sgbm_block_size: 5
  sgbm_uniqueness_ratio: 10
  sgbm_speckle_window_size: 100
  sgbm_speckle_range: 2

